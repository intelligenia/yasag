openapi: 3.0.3
info:
  title: Fixture API
  version: 2.1.0
servers:
  - url: "{scheme}://api.example.com/{basePath}"
    variables:
      scheme:
        default: https
      basePath:
        default: v2
tags:
  - name: pets
paths:
  /pets:
    get:
      operationId: listPets
      tags: [pets]
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [available, pending, sold]
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pet'
        default:
          $ref: '#/components/responses/ErrorResponse'
    post:
      operationId: createPet
      tags: [pets]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PetInput'
      responses:
        '201':
          description: created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
  /pets/{id}:
    get:
      operationId: getPet
      tags: [pets]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
  /pets/{id}/photo:
    post:
      operationId: uploadPhoto
      tags: [pets]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                caption:
                  type: string
      responses:
        '200':
          description: ok
components:
  parameters:
    LimitParam:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
  responses:
    ErrorResponse:
      description: error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
  schemas:
    ApiError:
      type: object
      properties:
        code:
          type: integer
        message:
          type: string
    Category:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
    PetStatusEnum:
      type: string
      enum: [available, pending, sold]
    PetInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
        status_ref:
          $ref: '#/components/schemas/PetStatusEnum'
        category:
          $ref: '#/components/schemas/Category'
        tags:
          type: array
          items:
            type: string
        status:
          type: string
          nullable: true
          enum: [available, pending, sold]
    Pet:
      allOf:
        - $ref: '#/components/schemas/PetInput'
        - type: object
          required: [id]
          properties:
            id:
              type: integer
              format: int64
